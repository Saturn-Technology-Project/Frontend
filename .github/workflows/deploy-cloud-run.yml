name: Deploy Frontend to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  GAR_LOCATION: ${{ vars.GAR_LOCATION }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY || 'saturn' }}
  CLOUD_RUN_SERVICE: ${{ vars.FRONTEND_CLOUD_RUN_SERVICE || 'saturn-frontend' }}
  IMAGE_NAME: saturn-frontend
  API_URL: https://api.saturn-core.com
  GITLEAKS_VERSION: 8.30.1
  # sha256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz, from that release's checksums.txt.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Gitleaks
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl -sSfL -o "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" dir . --no-banner --redact
          "${RUNNER_TEMP}/gitleaks" git . --log-opts="-1" --no-banner --redact

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Configure Docker auth
        run: gcloud auth configure-docker "${GAR_LOCATION}-docker.pkg.dev" --quiet

      - name: Build image tag
        id: image
        run: |
          IMAGE_URI="${GAR_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"
          echo "uri=${IMAGE_URI}" >> "${GITHUB_OUTPUT}"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: ${{ steps.image.outputs.uri }}
          build-args: |
            API_URL=${{ env.API_URL }}
            NEXT_PUBLIC_WS_URL=${{ env.API_URL }}

      - name: Deploy to Cloud Run
        env:
          IMAGE_REF: ${{ steps.image.outputs.uri }}@${{ steps.build.outputs.digest }}
          MAX_INSTANCES: ${{ vars.MAX_INSTANCES || '10' }}
          # The service's own runtime identity. Unset: it keeps the one it has.
          RUNTIME_SERVICE_ACCOUNT: ${{ vars.RUNTIME_SERVICE_ACCOUNT }}
          # all | internal | internal-and-cloud-load-balancing. Unset: the service keeps its current
          # ingress. Set internal-and-cloud-load-balancing once the console sits behind the load
          # balancer, so its *.run.app address no longer bypasses Cloudflare.
          CLOUD_RUN_INGRESS: ${{ vars.CLOUD_RUN_INGRESS }}
          # Secret Manager secret shared with the API (its CONSOLE_PROXY_SECRET_NAME). With it the
          # console tells the API each browser's address, so login limits are per user, not shared.
          CONSOLE_PROXY_SECRET_NAME: ${{ vars.CONSOLE_PROXY_SECRET_NAME }}
        run: |
          set -euo pipefail
          extra=()
          if [ -n "${RUNTIME_SERVICE_ACCOUNT}" ]; then
            extra+=(--service-account "${RUNTIME_SERVICE_ACCOUNT}")
          fi
          case "${CLOUD_RUN_INGRESS}" in
            "") ;;
            all | internal | internal-and-cloud-load-balancing)
              extra+=(--ingress "${CLOUD_RUN_INGRESS}") ;;
            *)
              echo "::error::CLOUD_RUN_INGRESS must be all, internal or internal-and-cloud-load-balancing."
              exit 1 ;;
          esac
          secrets="ORIGIN_AUTH_SECRET=ORIGIN_AUTH_SECRET:latest"
          if [ -n "${CONSOLE_PROXY_SECRET_NAME}" ]; then
            secrets="${secrets},CONSOLE_PROXY_SECRET=${CONSOLE_PROXY_SECRET_NAME}:latest"
          fi
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --image "${IMAGE_REF}" \
            --platform managed \
            --allow-unauthenticated \
            --port 3000 \
            --timeout 300 \
            --max-instances "${MAX_INSTANCES}" \
            --set-env-vars "API_URL=${API_URL}" \
            --set-secrets "${secrets}" \
            "${extra[@]}"
